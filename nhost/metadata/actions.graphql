type Mutation {
  triggerWorkflowRun(workflow_id: uuid!): TriggerWorkflowRunOutput
  triggerWorkflowRunWebhook(trigger_id: uuid!, token: String!, payload: json): TriggerWorkflowRunOutput
  approveStep(step_run_id: uuid!): ApproveStepResponse
}

type TriggerWorkflowRunOutput {
  success: Boolean!
  workflow_run_id: uuid
  message: String!
}

type ApproveStepResponse {
  success: Boolean!
  message: String!
}